<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4361ff">
  <title>e-Rapor — SD Negeri 108 Palembang</title>
  <link rel="icon" href="https://lh3.googleusercontent.com/d/1y7uSeQTv9gfPLRiTM7yYbW74Cpv6DXJp" type="image/png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f5fb; overscroll-behavior: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

    /* Aplikasi Apps Script (iframe layar penuh) */
    #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; background: #f4f5fb; }

    /* Layar muat awal */
    #loader {
      position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 18px; text-align: center; padding: 24px; color: #fff;
      background: linear-gradient(135deg, #4361ff 0%, #6a3df5 55%, #8b2fd6 100%);
      transition: opacity .35s ease, visibility .35s ease;
    }
    #loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .ring { width: 54px; height: 54px; border-radius: 50%; border: 4px solid rgba(255,255,255,.28); border-top-color: #fff; animation: spin .9s linear infinite; }
    .ttl { font-size: 20px; font-weight: 800; letter-spacing: .3px; }
    .sub { font-size: 13px; opacity: .9; }
    .bar { width: 180px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.28); overflow: hidden; }
    .bar span { display: block; height: 100%; width: 40%; border-radius: 4px; background: #fff; animation: slide 1.2s ease-in-out infinite; }
    #slow { display: none; flex-direction: column; align-items: center; gap: 10px; font-size: 13px; }
    #slow.show { display: flex; }
    .btn { appearance: none; border: 0; cursor: pointer; text-decoration: none; font: inherit; font-weight: 700; font-size: 13px; padding: 9px 16px; border-radius: 10px; background: #fff; color: #4361ff; }
    .btn.ghost { background: rgba(255,255,255,.18); color: #fff; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(450%); } }
  </style>
</head>
<body>

  <iframe id="app" title="e-Rapor"
          allow="autoplay; fullscreen; clipboard-write; clipboard-read"
          allowfullscreen></iframe>

  <div id="loader">
    <div class="ring"></div>
    <div>
      <div class="ttl" id="ttl">e-Rapor</div>
      <div class="sub">SD Negeri 108 Palembang</div>
    </div>
    <div class="bar"><span></span></div>
    <div id="slow">
      <div>Memuat lebih lama dari biasanya…</div>
      <div class="row">
        <button class="btn" type="button" onclick="muatUlang()">Muat ulang</button>
        <a class="btn ghost" id="direct" href="#" target="_blank" rel="noopener">Buka langsung</a>
      </div>
    </div>
  </div>

  <noscript>
    <div style="position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#fff;color:#111;padding:24px;text-align:center;font-family:sans-serif;">
      Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript pada browser Anda lalu muat ulang halaman.
    </div>
  </noscript>

  <script>
    // ==================== PENGATURAN (hanya bagian ini yang perlu diubah) ====================
    // URL web app Apps Script: Deploy > Manage deployments > salin "Web app URL" (berakhiran /exec).
    var APP_URL = 'https://script.google.com/macros/s/AKfycbw3yspW1_6jfaI3LXpYfzdwDx3Wb36QsG65hv7uZIAivRnRRBSBlda5KT56ZXDnZrjW/exec';
    var APP_NAME = 'e-Rapor';          // judul pada layar muat
    var MIN_LOADER_MS = 700;           // waktu minimum layar muat tampil
    var SLOW_AFTER_MS = 15000;         // tombol "Muat ulang" muncul bila belum selesai sampai waktu ini
    // =========================================================================================

    var frame = document.getElementById('app');
    var loader = document.getElementById('loader');
    var slow = document.getElementById('slow');
    var started = Date.now();
    var slowTimer = null;

    document.getElementById('ttl').textContent = APP_NAME;
    document.getElementById('direct').href = APP_URL;

    function tampilkanAplikasi() {
      clearTimeout(slowTimer);
      var sisa = Math.max(0, MIN_LOADER_MS - (Date.now() - started));
      setTimeout(function () { loader.classList.add('hide'); }, sisa);
    }

    function muatApp() {
      started = Date.now();
      loader.classList.remove('hide');
      slow.classList.remove('show');
      clearTimeout(slowTimer);
      slowTimer = setTimeout(function () { slow.classList.add('show'); }, SLOW_AFTER_MS);
      frame.src = APP_URL;
    }

    function muatUlang() { muatApp(); }

    frame.addEventListener('load', tampilkanAplikasi);

    if (/GANTI_DENGAN_ID_DEPLOYMENT/.test(APP_URL)) {
      document.querySelector('.ring').style.display = 'none';
      document.querySelector('.bar').style.display = 'none';
      document.querySelector('.sub').textContent = 'APP_URL belum diisi. Buka index.html dan isi alamat web app Apps Script.';
    } else {
      muatApp();
    }
  </script>
</body>
</html>
